name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: term-img-linux
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: term-img-windows
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: term-img-macos
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/term-img${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dmg:
    name: Create DMG
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install target
        run: rustup target add x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create DMG
        run: |
          mkdir -p "TermImg.app/Contents/MacOS"
          cp "target/x86_64-apple-darwin/release/term-img" "TermImg.app/Contents/MacOS/"
          hdiutil create -volname "TermImg" \
            -srcfolder "TermImg.app" \
            -ov -format UDZO \
            term-img.dmg

      - name: Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          files: term-img.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
