name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: term-img-linux-x86_64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: term-img-linux-aarch64
            ext: ""
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: term-img-windows-x86_64
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: term-img-windows-aarch64
            ext: .exe
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: term-img-macos-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: term-img-macos-aarch64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install cross (for ARM64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build with cross (ARM64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (all other targets)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }}.tar.gz term-img
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/term-img.exe -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.target }}/release/term-img${{ matrix.ext }}
            ${{ matrix.asset_name }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

