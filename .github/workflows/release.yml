name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: term-img
          tar: all
          features: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
