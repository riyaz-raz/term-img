name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: term-img-linux-x86_64
            extension: ""
            package: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: term-img-windows-x86_64
            extension: .exe
            package: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: term-img-macos-x86_64
            extension: ""
            package: dmg

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czf ${{ matrix.asset_name }}.tar.gz -C target/${{ matrix.target }}/release term-img

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/term-img.exe -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Package (macOS DMG)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "TermImg.app/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/term-img" "TermImg.app/Contents/MacOS/"
          hdiutil create -volname "TermImg" \
            -srcfolder "TermImg.app" \
            -ov -format UDZO \
            ${{ matrix.asset_name }}.dmg

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.asset_name }}.*
            target/${{ matrix.target }}/release/term-img${{ matrix.extension }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
